<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Svampletarna - Inloggning</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main>

        <header>
            <h1>Logga in</h1>
            <p>Fyll i dina uppgifter för att logga in på ditt konto</p>
        </header>

        <form>
            <label for="name">Namn</label>
            <input type="text" id="name" placeholder="Ange ditt namn" required>

            <label for="password">Lösenord</label>
            <input type="password" id="password" placeholder="Ange ditt lösenord" required><br>

            <input type="submit" value="Logga in">
        </form>

        <img src="bild.png" alt="Svampletarna">

    </main>
</body>
</html>

<!-- DOM = Document Object Model
DOM-manipulation handlar om att:

Hämta element (getElementById, querySelector)
Ändra innehåll (textContent, innerHTML)
Ändra stil (style)
Lägga till eller ta bort element (createElement, appendChild, remove)
Hantera händelser (addEventListener)
Ändra attribut (setAttribute, getAttribute) 
-->
